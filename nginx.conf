server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Flutter web is a single-page app: deep links and in-app routes are not
    # real files on disk, so anything that doesn't resolve must fall back to
    # index.html and let the Dart router handle it. Without this, reloading on
    # any route other than "/" returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and the bootstrap script must never be cached, or a
    # returning browser keeps running the previous build even after a redeploy.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Hashed build artefacts are safe to cache hard.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|wasm)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length   1024;
}
