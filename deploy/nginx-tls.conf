# HTTPS front end for GymCRM.
#
# Used via the TLS override:
#   docker compose -f deploy/docker-compose.prod.yml \
#                  -f deploy/docker-compose.tls.yml \
#                  --env-file deploy/.env up -d
#
# ${DOMAIN} is substituted by nginx's envsubst entrypoint at container start,
# so this file is not edited per deployment.

# ── Port 80: redirect everything, except the ACME challenge ──────────────────
server {
    listen 80;
    server_name ${DOMAIN};

    # Certbot renews by dropping a file here and fetching it over plain HTTP.
    # This location MUST stay reachable without a redirect, or renewal fails
    # silently and the certificate expires 90 days later — which is how small
    # deployments go dark on a Sunday morning.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: the real server ────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # TLS 1.2 is kept because some Android phones in the field still need it.
    # 1.0 and 1.1 are not, and should not be re-added.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS tells browsers to refuse plain HTTP for this domain.
    #
    # It starts at 5 minutes ON PURPOSE. HSTS is not reversible from the server
    # side — once a browser has cached a long max-age, it will refuse to talk to
    # this domain over HTTP until that time expires, even if the certificate
    # breaks. Run for a week, confirm renewal works, THEN raise this to
    # 31536000. Do not add includeSubDomains or preload without meaning it.
    add_header Strict-Transport-Security "max-age=300" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;   # CSV imports go through this

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Same origin as the app, so the Flutter bundle uses relative URLs and
    # there is no CORS to configure.
    location /api/ {
        proxy_pass http://app:8089;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The Go service is behind TLS termination and never sees https://
        # directly. Without this it cannot tell how the client connected.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    location /swagger/ {
        proxy_pass http://app:8089;
        proxy_set_header Host $host;
    }

    location ~* \.(?:js|wasm|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser keeps loading the old
    # bundle after a deploy and the update appears not to have happened.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
