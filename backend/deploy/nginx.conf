server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;   # CSV imports go through this

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # The API is proxied under the SAME origin as the app. That is the whole
    # point of this file: with relative URLs there is no CORS to configure, no
    # mixed-content problem behind HTTPS, and no rebuild of the Flutter bundle
    # when the API's hostname changes.
    location /api/ {
        proxy_pass http://app:8089;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scans and imports can take a while on a large gym.
        proxy_read_timeout 120s;
    }

    location /swagger/ {
        proxy_pass http://app:8089;
        proxy_set_header Host $host;
    }

    # The Flutter entry files keep the SAME name on every build (main.dart.js is
    # not content-hashed), so they must be revalidated each time. Caching them
    # as immutable pinned browsers to the first build they ever loaded: a deploy
    # went live on the server but users kept running the old app for up to 30
    # days. no-cache still lets the browser reuse its copy via ETag (a cheap
    # 304) when nothing changed.
    location ~ ^/(main\.dart\.js|flutter\.js|flutter_bootstrap\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Images, fonts and the like are safe to cache hard.
    location ~* \.(?:js|wasm|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached. If it is, a browser keeps loading the
    # old bundle after a deploy and the update appears not to have happened —
    # exactly the stale-build confusion that has bitten this project before.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
